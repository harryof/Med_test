<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест: Топическая диагностика в неврологии</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --success: #22c55e;
            --success-light: #dcfce7;
            --error: #ef4444;
            --error-light: #fee2e2;
            --text: #334155;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent; /* Убирает синюю рамку при тапе на смартфонах */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin: auto;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
            font-size: 0.95rem;
            padding: 0 10px;
        }

        /* Экран приветствия / Меню */
        #menu-screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
        }

        .menu-btn {
            width: 100%;
            max-width: 100%;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
            text-align: center;
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        /* Экран теста */
        #quiz-screen {
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .quiz-title {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score-board {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-item {
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
            background: #fff;
            user-select: none;
        }

        .option-item.correct {
            border-color: var(--success) !important;
            background-color: var(--success-light) !important;
            color: #166534;
            font-weight: 600;
        }

        .option-item.wrong {
            border-color: var(--error) !important;
            background-color: var(--error-light) !important;
            color: #991b1b;
        }

        .option-item.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Блок подсказок и рационале */
        .rationale-box {
            display: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border-left: 4px solid;
            animation: fadeIn 0.2s ease;
        }

        .rationale-box.info {
            background: #f1f5f9;
            border-left-color: #64748b;
            color: #334155;
        }

        /* Навигация */
        .nav-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 2px solid #f1f5f9;
            padding-top: 16px;
        }

        .nav-buttons-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .btn {
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            font-size: 0.9rem;
            text-align: center;
            flex: 1;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #cbd5e1;
            color: #64748b;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        #next-btn {
            display: none;
            margin-bottom: 4px;
        }

        /* Экран результатов */
        #result-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .result-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;
        }

        .result-comment {
            font-size: 1rem;
            color: #475569;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* МЕДИА-ЗАПРОСЫ ДЛЯ БОЛЬШИХ ЭКРАНОВ (ПК) */
        @media (min-width: 600px) {
            body { padding: 20px; }
            .container { padding: 30px; }
            h1 { font-size: 1.8rem; }
            .quiz-header { padding-bottom: 15px; margin-bottom: 25px; }
            .quiz-title { font-size: 1.1rem; }
            .score-board { font-size: 0.9rem; padding: 6px 14px; }
            .question-text { font-size: 1.2rem; }
            .option-item { font-size: 1rem; padding: 14px 20px; }
            .nav-controls { flex-direction: row-reverse; justify-content: space-between; padding-top: 20px; }
            .nav-buttons-group { width: auto; flex: none; gap: 15px; }
            .btn { flex: none; padding: 10px 20px; }
            #next-btn { width: auto; margin-bottom: 0; }
            .menu-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
            .option-item:hover:not(.disabled) { border-color: var(--primary); background: #f0f9ff; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-screen">
        <h1>Топическая диагностика</h1>
        <p class="subtitle">Учебный интерактивный квиз для медицинских специалистов</p>
        <button class="menu-btn" onclick="startQuiz(1)">Часть 1 "Двигательная сфера"</button>
        <button class="menu-btn" onclick="startQuiz(2)">Часть 2 "Чувствительная сфера"</button>
    </div>

    <div id="quiz-screen">
        <div class="quiz-header">
            <span class="quiz-title" id="current-quiz-title">Часть</span>
            <span class="score-board" id="score-display">Баллы: 0 / 0</span>
        </div>

        <div class="question-box">
            <div class="question-number" id="q-number">Вопрос 1 из X</div>
            <div class="question-text" id="q-text">Текст вопроса</div>
        </div>

        <div class="options-list" id="options-container">
            </div>

        <div class="rationale-box info" id="rationale-container">
            </div>

        <div class="nav-controls">
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Дальше &rarr;</button>
            <div class="nav-buttons-group">
                <button class="btn btn-outline" onclick="exitToMenu()">В меню</button>
                <button class="btn btn-outline" onclick="restartCurrentQuiz()">Заново</button>
            </div>
        </div>
    </div>

    <div id="result-screen">
        <h1>Тестирование завершено!</h1>
        <div class="result-score" id="final-score">0 / 0</div>
        <p class="result-comment" id="final-comment">Отличный результат!</p>
        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin: 0 auto;">
            <button class="btn btn-primary" onclick="exitToMenu()">Вернуться в меню</button>
            <button class="btn btn-outline" onclick="restartCurrentQuiz()">Пройти еще раз</button>
        </div>
    </div>
</div>

<script>
    // БАЗА ДАННЫХ ВОПРОСОВ
    const quizData = {
        1: {
            title: 'Часть 1 "Двигательная сфера"',
            questions: [
                {
                    q: "Где располагается центральный двигательный нейрон?",
                    options: ["передние рога спинного мозга", "передняя центральная извилина", "задние рога спинного мозга", "спинномозговой ганглий"],
                    correct: 1,
                    rationale: "В прецентральной извилине коры больших полушарий (в клетках Беца) берут начало волокна пирамидного пути, управляющего произвольными движениями."
                },
                {
                    q: "Где находится периферический двигательный нейрон?",
                    options: ["передние рога спинного мозга", "передняя центральная извилина", "задние рога спинного мозга", "спинномозговой ганглий"],
                    correct: 0,
                    rationale: "В передних рогах серого вещества спинного мозга залегают крупные альфа- и гамма-мотонейроны, непосредственно иннервирующие скелетные мышцы."
                },
                {
                    q: "В каком отделе внутренней капсулы проходит пирамидный путь?",
                    options: ["переднее бедро", "колено", "передние 2/3 заднего бедра", "задняя треть заднего бедра"],
                    correct: 2,
                    rationale: "Именно в проекции передних двух третей задней ножки внутренней капсулы компактно сгруппированы волокна кортикоспинального (пирамидного) пути."
                },
                {
                    q: "В каком отделе внутренней капсулы проходит корково-ядерный путь?",
                    options: ["переднее бедро", "колено", "передние 2/3 заднего бедра", "задняя треть заднего бедра"],
                    correct: 1,
                    rationale: "Корково-ядерный путь (tr. corticonuclearis) совершает изгиб и проходит строго через колено (genu) внутренней капсулы."
                },
                {
                    q: "Как осуществляется иннервация нижних отделов лицевой мускулатуры?",
                    options: ["двусторонняя корковая иннервация", "односторонняя перекрестная корковая иннервация"],
                    correct: 1,
                    rationale: "Ядра нижней части лицевого нерва получают импульсы только из противоположного полушария мозга, поэтому при инсульте страдает только нижняя половина лица."
                },
                {
                    q: "Как осуществляется иннервация мышц шеи, туловища, промежности?",
                    options: ["двусторонняя корковая иннервация", "односторонняя перекрестная корковая иннервация"],
                    correct: 0,
                    rationale: "Мышцы осевого скелета застрахованы и управляются обоими полушариями, обеспечивая сохранность жизненно важных позотонических функций."
                },
                {
                    q: "Как осуществляется иннервация мышц конечностей?",
                    options: ["двусторонняя корковая иннервация", "односторонняя перекрестная корковая иннервация"],
                    correct: 1,
                    rationale: "Каждая конечность управляется строго противоположным полушарием головного мозга посредством перекрещенного пирамидного пути."
                },
                {
                    q: "Где проходят аксоны двигательных нейронов спинного мозга?",
                    options: ["передние корешки", "задние корешки", "боковые столбы"],
                    correct: 0,
                    rationale: "По закону Белла-Мажанди двигательные эфферентные волокна покидают спинного мозг строго в составе передних корешков."
                },
                {
                    q: "Как называется полная утрата произвольных движений в той или иной группе мышц?",
                    options: ["плегия", "парез", "атрофия"],
                    correct: 0,
                    rationale: "Плегия (или паралич) означает абсолютную невозможность совершить произвольное движение."
                },
                {
                    q: "Как называется неполная утрата произвольных движений в той или иной группе мышц?",
                    options: ["плегия", "парез", "атония", "гипотрофия"],
                    correct: 1,
                    rationale: "Парез описывает лишь частичное ограничение или снижение силы движений при сохранении их минимальной возможности."
                },
                {
                    q: "Как называется паралич одной конечности?",
                    options: ["моноплегия", "гемиплегия", "параплегия", "тетраплегия"],
                    correct: 0,
                    rationale: "Приставка «моно-» указывает на изолированное вовлечение одной руки или одной ноги."
                },
                {
                    q: "Как называется паралич правых или левых конечностей?",
                    options: ["параплегия", "гемиплегия", "тетраплегия", "моноплегия"],
                    correct: 1,
                    rationale: "Гемиплегия — это паралич половины тела (рука и нога с одной стороны), типичный для капсулярных поражений."
                },
                {
                    q: "Как называется паралич верхних или нижних конечностей?",
                    options: ["гемиплегия", "параплегия", "моноплегия", "тетраплегия"],
                    correct: 1,
                    rationale: "Параплегия означает сочетанный паралич либо обеих ног (нижняя), либо обеих рук (верхняя), что часто бывает при спинальной травме."
                },
                {
                    q: "Каковы признаки периферического паралича?",
                    options: [
                        "гипотония мышц, атрофия мышц, утрата или снижение глубоких рефлексов",
                        "повышение глубоких рефлексов, повышение мышечного тонуса",
                        "гипертония мышц и появление патологических знаков"
                    ],
                    correct: 0,
                    rationale: "Для вялого (периферического) паралича характерна классическая триада: мышечная гипотония, амиотрофия и гипо-/арефлексия в связи с перерывом рефлекторной дуги."
                },
                {
                    q: "Что не характерно для периферического паралича?",
                    options: [
                        "понижение мышечного тонуса и исчезновение рефлексов",
                        "повышение сухожильных рефлексов и патологические рефлексы",
                        "фибриллярные и фасцикулярные подергивания"
                    ],
                    correct: 1,
                    rationale: "Гиперрефлексия и патологические знаки (например, Бабинского) указывают на растормаживание сегментарного аппарата, что свойственно исключительно центральному параличу."
                },
                {
                    q: "Каковы признаки центрального паралича?",
                    options: [
                        "гипертония мышц по спастическому типу, повышение глубоких рефлексов, исчезновение кожных рефлексов, патологические рефлексы",
                        "понижение сухожильных рефлексов и фибриллярные подергивания",
                        "выраженная мышечная атрофия и диффузная гипотония"
                    ],
                    correct: 0,
                    rationale: "При повреждении центрального нейрона исчезает тормозное влияние коры, что ведет к спастичности, гиперрефлексии, патологическим знакам и угнетению поверхностных кожных рефлексов."
                },
                {
                    q: "Что не характерно для центрального паралича?",
                    options: ["повышение глубоких рефлексов", "патологические рефлексы", "гипотония мышц", "гипертония мышц"],
                    correct: 2,
                    rationale: "Для центрального паралича характерна гипертония по спастическому типу (симптом 'складного ножа'). Диффузная гипотония для него нехарактерна."
                },
                {
                    q: "Каковы признаки поражения периферического нерва?",
                    options: ["вялый паралич или парез группы мышц, иннервируемых данным нервом", "спастический паралич конечности", "вялый паралич всей конечности", "спастическая гемиплегия"],
                    correct: 0,
                    rationale: "Периферический нерв иннервирует строго ограниченную зону, его повреждение разрывает рефлекторную дугу на локальном уровне, вызывая местный вялый парез."
                },
                {
                    q: "Симптомы поражения передних рогов спинного мозга",
                    options: [
                        "периферический паралич мышц, иннервируемых данными сегментами, и фибриллярные подергивания",
                        "центральный паралич на противоположной стороне",
                        "спастический паралич на стороне очага"
                    ],
                    correct: 0,
                    rationale: "Разрушение тел мотонейронов в рогах дает вялый паралич в данном сегменте, а их хроническое раздражение перед гибелью манифестирует фибрилляциями."
                },
                {
                    q: "Что характерно для поражения боковых столбов спинного мозга?",
                    options: ["центральный паралич на стороне очага ниже уровня поражения", "периферический паралич на стороне очага", "центральный паралич на противоположной стороне", "периферический паралич на противоположной стороне"],
                    correct: 0,
                    rationale: "В боковых столбах проходит латеральный корково-спинномозговой путь, который уже совершил перекрест в продолговатом мозге, поэтому страдает своя сторона тела."
                },
                {
                    q: "Какие двигательные расстройства возникают при поражении в области ствола головного мозга?",
                    options: [
                        "центральная гемиплегия на противоположной стороне и вялый парез мимических мышц/ЧН на стороне поражения",
                        "центральная гемиплегия на стороне поражения",
                        "вялый парез мимических мышц на противоположной стороне"
                    ],
                    correct: 0,
                    rationale: "Это манифестация классического альтернирующего синдрома: ядра ЧН страдают по периферическому типу на стороне очага, а проводящие пути конечностей — по центральному типу на противоположной."
                },
                {
                    q: "Каковы симптомы поражения внутренней капсулы?",
                    options: [
                        "паралич нижней половины мимических мышц и языка на стороне очага",
                        "центральная гемиплегия на стороне очага",
                        "центральная гемиплегия и паралич нижней половины мимических мышц и языка на противоположной очагу стороне"
                    ],
                    correct: 2,
                    rationale: "Капсулярный очаг лежит выше перекреста всех двигательных проводников (кортикоспинального и кортиконуклеарного), поэтому вся симптоматика уходит строго на гетеролатеральную сторону."
                },
                {
                    q: "Что характерно для поражения верхних отделов передней центральной извилины?",
                    options: ["нижняя моноплегия на противоположной стороне", "верхняя моноплегия на стороне очага", "нижняя моноплегия на стороне очага", "гемиплегия на противоположной стороне"],
                    correct: 0,
                    rationale: "Согласно гомункулусу Пенфилда, ноги проецируются в самых верхних отделах прецентральной извилины и на медиальной поверхности полушария."
                },

                    options: ["латерально", "медиально", "вентрально"],
                    correct: 1,
                    rationale: "Тонкий пучок (Голля) собирает проводники от нижних конечностей, которые входят первыми и прижимаются медиально к срединной перегородке."
                },
                {
                    q: "Как в клиновидном пучке задних канатиков располагаются волокна для туловища и верхних конечностей по отношению к средней линии?",
                    options: ["латерально", "медиально", "вентрально"],
                    correct: 0,
                    rationale: "Клиновидный пучок (Бурдаха) формируется шейными и грудными сегментами и по мере вхождения наслаивается латеральнее уже имеющегося пучка Голля."
                }
            ]
        }
    };

    // СОСТОЯНИЕ ПРИЛОЖЕНИЯ
    let currentQuizId = null;
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // ЭЛЕМЕНТЫ ИНТЕРФЕЙСА
    const menuScreen = document.getElementById('menu-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const currentQuizTitle = document.getElementById('current-quiz-title');
    const scoreDisplay = document.getElementById('score-display');
    const qNumber = document.getElementById('q-number');
    const qText = document.getElementById('q-text');
    const optionsContainer = document.getElementById('options-container');
    const rationaleContainer = document.getElementById('rationale-container');
    const nextBtn = document.getElementById('next-btn');

    // ФУНКЦИЯ ЗАПУСКА ТЕСТА
    function startQuiz(partId) {
        currentQuizId = partId;
        currentQuestionIndex = 0;
        score = 0;
        answered = false;
        
        menuScreen.style.display = 'none';
        resultScreen.style.display = 'none';
        quizScreen.style.display = 'block';

        currentQuizTitle.innerText = quizData[currentQuizId].title;
        showQuestion();
    }

    // ВЫВОД ТЕКУЩЕГО ВОПРОСА
    function showQuestion() {
        answered = false;
        nextBtn.style.display = 'none';
        rationaleContainer.style.display = 'none';
        
        const currentQuiz = quizData[currentQuizId];
        const currentQ = currentQuiz.questions[currentQuestionIndex];

        qNumber.innerText = `Вопрос ${currentQuestionIndex + 1} из ${currentQuiz.questions.length}`;
        qText.innerText = currentQ.q;
        scoreDisplay.innerText = `Баллы: ${score} / ${currentQuiz.questions.length}`;

        optionsContainer.innerHTML = '';
        currentQ.options.forEach((option, index) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerText = option;
            div.onclick = () => selectOption(index, div);
            optionsContainer.appendChild(div);
        });
    }

    // ОБРАБОТКА ВЫБОРА ВАРИАНТА ОТВЕТА
    function selectOption(selectedIndex, element) {
        if (answered) return; 
        answered = true;

        const currentQ = quizData[currentQuizId].questions[currentQuestionIndex];
        const items = optionsContainer.getElementsByClassName('option-item');

        for (let item of items) {
            item.classList.add('disabled');
        }

        if (selectedIndex === currentQ.correct) {
            element.classList.add('correct');
            score++;
        } else {
            element.classList.add('wrong');
            items[currentQ.correct].classList.add('correct'); 
        }

        scoreDisplay.innerText = `Баллы: ${score} / ${quizData[currentQuizId].questions.length}`;
        rationaleContainer.innerText = currentQ.rationale;
        rationaleContainer.style.display = 'block';
        nextBtn.style.display = 'block';
        
        // Автоматический плавный скролл к пояснению на мобильных устройствах
        setTimeout(() => {
            rationaleContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    // ПЕРЕХОД К СЛЕДУЮЩЕМУ ВОПРОСУ
    function nextQuestion() {
        currentQuestionIndex++;
        const totalQuestions = quizData[currentQuizId].questions.length;

        if (currentQuestionIndex < totalQuestions) {
            showQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Возврат в начало вопроса
        } else {
            showResults();
        }
    }

    // ЭКРАН ФИНАЛЬНЫХ РЕЗУЛЬТАТОВ
    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';

        const total = quizData[currentQuizId].questions.length;
        document.getElementById('final-score').innerText = `${score} / ${total}`;

        const percentage = (score / total) * 100;
        let comment = '';

        if (percentage === 100) {
            comment = 'Идеально! Вы великолепно знаете топическую диагностику нервной системы.';
        } else if (percentage >= 80) {
            comment = 'Отличный результат! Высокий уровень знаний неврологии.';
        } else if (percentage >= 50) {
            comment = 'Хорошо, но есть над чем поработать. Рекомендуется повторить анатомию проводящих путей.';
        } else {
            comment = 'Неудовлетворительно. Рекомендуется заново изучить разделы двигательной и чувствительной сфер.';
        }

        document.getElementById('final-comment').innerText = comment;
    }

    // ПЕРЕЗАПУСК ТЕКУЩЕГО ТЕСТА
    function restartCurrentQuiz() {
        if (currentQuizId) {
            startQuiz(currentQuizId);
        }
    }

    // ВЫХОД В ГЛАВНОЕ МЕНЮ
    function exitToMenu() {
        currentQuizId = null;
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'none';
        menuScreen.style.display = 'flex';
    }
</script>
